
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white d-flex flex-column min-vh-100">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-black">
    <div class="container">
        <a class="navbar-brand fw-bold text-danger" href="index.html">LEVEL UP GAMING</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- CONTACT SECTION -->
<div class="container py-5">

    <div class="text-center mb-4">
        <h1 class="display-4 fw-bold text-danger">CONTACT US</h1>
        <p class="text-info">Have a question? Get in touch with us!</p>
    </div>

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-6">

            <div class="card bg-secondary text-white shadow">

                <div class="card-body p-4">

                    <h3 class="text-center mb-4">Send Us A Message</h3>

                    <form>

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" placeholder="Enter your name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" placeholder="Enter your email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Subject</label>
                            <select class="form-select">
                                <option>General Enquiry</option>
                                <option>Product Information</option>
                                <option>Technical Support</option>
                                <option>Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea class="form-control" rows="5" placeholder="Write your message here..." required></textarea>
                        </div>

                        <button type="button" class="btn btn-danger w-100">
                            Send Message
                        </button>

                    </form>

                    <div class="alert alert-info mt-3 mb-0 text-center">
                        This is a demonstration contact form.
                        Messages will not actually be sent.
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<footer class="bg-black text-center py-3 mt-auto">

</footer>
